name: build-autoflex

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: brew install ldid dpkg

      - name: install theos
        run: |
          export THEOS=$RUNNER_TEMP/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.tar.gz | tar xz -C /tmp
          mkdir -p "$THEOS/sdks"
          mv /tmp/sdks-master/*.sdk "$THEOS/sdks/"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: build
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: autoflex-deb
          path: packages/*.deb
