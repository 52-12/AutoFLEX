name: build-autoflex

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make clang lld curl xz-utils file dpkg-dev \
            fakeroot perl pkg-config libplist-dev libssl-dev zlib1g-dev

      - name: install theos + sdk
        run: |
          export THEOS=/opt/theos
          sudo mkdir -p "$THEOS"
          sudo chown -R "$USER:$USER" "$THEOS"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          curl -fL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -o /tmp/sdks.tgz
          tar xzf /tmp/sdks.tgz -C /tmp
          mkdir -p "$THEOS/sdks"
          cp -r /tmp/sdks-master/*.sdk "$THEOS/sdks/"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: install ldid
        run: |
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          make -C /tmp/ldid -j"$(nproc)"
          sudo cp /tmp/ldid/ldid /usr/local/bin/ldid

      - name: install ios toolchain
        run: |
          curl -fL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz -o /tmp/tc.tar.xz
          tar -xJf /tmp/tc.tar.xz -C "$THEOS/toolchain/"

      - name: build
        run: bash build-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: autoflex-deb
          path: packages/*.deb
